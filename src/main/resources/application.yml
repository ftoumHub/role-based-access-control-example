# Configuration de base : aucune valeur secrète par défaut.
# Les secrets viennent de l'environnement ; le profil "dev" fournit des valeurs locales.
spring:
  application:
    name: role-based-access-control-example
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # le schéma appartient à Liquibase
  liquibase:
    change-log: classpath:db/liquibase-changelog.xml
    contexts: ${LIQUIBASE_CONTEXTS:prod}
  session:
    jdbc:
      initialize-schema: never   # tables créées par Liquibase
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  thymeleaf:
    cache: true

server:
  # X-Forwarded-For n'est pris en compte que s'il vient d'un proxy de confiance
  # (par défaut Tomcat : 10/8, 192.168/16, 172.16/12, 127/8, 169.254/16).
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: MONITORING
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    io.lombocska: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: INFO

app:
  security:
    brute-force:
      captcha-threshold: 3
      lock-threshold: 10
      window: 15m
      lock-duration: 15m
      store: redis
    recaptcha:
      site-key: ${RECAPTCHA_SITE_KEY}
      secret-key: ${RECAPTCHA_SECRET_KEY}
    webauthn:
      rp-id: ${WEBAUTHN_RP_ID:localhost}
      rp-name: RBAC example
      allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:http://localhost:8080}
    monitoring:
      username: prometheus
      password: ${MONITORING_PASSWORD}
