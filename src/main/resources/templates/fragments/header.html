<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:fragment="header-css">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
              integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
              crossorigin="anonymous">
    </th:block>
</head>
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <a class="navbar-brand" th:href="@{/}">RBAC example</a>
    <ul class="navbar-nav mr-auto">
        <li class="nav-item" sec:authorize="isAuthenticated()">
            <a class="nav-link" th:href="@{/account}">Mon compte</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" th:href="@{/administration/accounts}">Administration</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('EDITOR')">
            <a class="nav-link" th:href="@{/content-editor}">Éditeur</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('USER')">
            <a class="nav-link" th:href="@{/user}">Utilisateur</a>
        </li>
    </ul>
    <div class="form-inline" sec:authorize="isAuthenticated()">
        <span class="navbar-text mr-3" sec:authentication="name">user</span>
        <a class="btn btn-outline-secondary btn-sm mr-2" th:href="@{/webauthn/register}">Mes passkeys</a>
        <!-- Déconnexion en POST, protégée par le jeton CSRF ajouté automatiquement par th:action -->
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger btn-sm">Se déconnecter</button>
        </form>
    </div>
    <a class="btn btn-primary btn-sm" sec:authorize="isAnonymous()" th:href="@{/login}">Se connecter</a>
</nav>
</body>
</html>
