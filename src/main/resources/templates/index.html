<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Accueil</title>
    <th:block th:replace="~{fragments/header :: header-css}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/header :: header}"></nav>
<div class="container">
    <h1>Accueil</h1>
    <p sec:authorize="isAuthenticated()">Connecté en tant que <strong sec:authentication="name">user</strong>.</p>
    <p sec:authorize="isAnonymous()"><a th:href="@{/login}">Se connecter</a></p>
</div>
</body>
</html>
