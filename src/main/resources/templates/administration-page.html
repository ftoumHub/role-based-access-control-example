<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Administration</title>
    <th:block th:replace="~{fragments/header :: header-css}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/header :: header}"></nav>
<div class="container">
    <h1>Comptes</h1>
    <p class="text-muted">Accès réservé à ROLE_ADMIN avec deux facteurs (passkey, ou mot de passe + lien à usage unique).</p>
    <table class="table table-sm">
        <thead class="thead-dark">
        <tr><th>#</th><th>Email</th><th>Nom</th><th>Rôles</th><th>Dernière connexion</th><th>État</th></tr>
        </thead>
        <tbody>
        <tr th:each="account : ${accounts}">
            <td th:text="${account.id}">1</td>
            <td th:text="${account.email}">email</td>
            <td th:text="${account.userName}">nom</td>
            <td th:text="${#strings.setJoin(account.authorities, ', ')}">rôles</td>
            <td th:text="${account.lastLoginDate}">date</td>
            <td>
                <span th:if="${!account.enabled}" class="badge badge-secondary">désactivé</span>
                <span th:if="${account.lockedUntil != null}" class="badge badge-warning"
                      th:text="|verrouillé jusqu’à ${account.lockedUntil}|">verrouillé</span>
                <span th:if="${account.enabled and account.lockedUntil == null}" class="badge badge-success">actif</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
