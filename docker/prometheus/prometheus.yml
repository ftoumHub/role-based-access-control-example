global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'app'

scrape_configs:
  # Port de management (8081), réservé au compte technique de supervision
  - job_name: 'rbac-app'
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password: dev-monitoring
    static_configs:
      - targets:
          - app:8081
