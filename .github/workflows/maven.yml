name: Java CI with Maven

on:
  push:
    branches:
      - 'master'
      - 'feature/**'
  pull_request:

jobs:
  build:
    name: Tests unitaires et d'intégration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Les tests d'intégration démarrent PostgreSQL et Redis via Testcontainers (Docker du runner)
      - name: Maven verify
        run: mvn -B -ntp verify
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
      - name: Image Docker
        run: docker build -t role-based-access-control-example:ci .
